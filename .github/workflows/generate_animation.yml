name: generate animation

on:
  # Run automatically every day at 00:00 UTC
  # = 08:00 Beijing Time (UTC+8)
  schedule:
    - cron: "0 0 * * *"

  # Allow manual execution
  workflow_dispatch:

  # Run when main branch is updated
  push:
    branches:
      - main


jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ========================================
      # Checkout repository
      # ========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================
      # Generate GitHub contribution snake
      # ========================================
      - name: Generate GitHub contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark


      # ========================================
      # Generate GitHub Profile Summary Cards
      # ========================================
      - name: Generate GitHub profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 8
          THEME: radical
          AUTO_PUSH: false


      # ========================================
      # Prepare summary cards
      # ========================================
      - name: Copy profile summary cards to dist
        run: |
          mkdir -p dist/profile-summary-card-output

          cp -r profile-summary-card-output/radical \
            dist/profile-summary-card-output/


      # ========================================
      # Publish all generated files to output branch
      # ========================================
      - name: Push generated files to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}